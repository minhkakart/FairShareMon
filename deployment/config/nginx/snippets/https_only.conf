# Force HTTPS for browser-facing hosts (planning/https-scheme-enforcement.md).
# `include` this at the TOP of a server block — server context, not inside a location.
#
# Why this exists: with no redirect, a device that loads the SPA over plain http gets an
# `http://` Origin, which fails the https-only App:AllowedOrigins list. The API then answers
# every preflight with a bare 204 and no CORS headers, so the browser blocks the real request
# and the failure is invisible in access logs. Safari hit exactly this.
#
# Opt-in per host on purpose — a host is covered only by including this file, so non-browser
# upstreams (e.g. a Docker registry, whose client tooling should not be pushed through a
# redirect) stay untouched.
#
# Note: browsers do not follow redirects on a preflight OPTIONS. That is not a regression —
# an https page calling an http API is already blocked as mixed content before it leaves the
# browser, so a plaintext preflight is already dead. The 301 helps non-browser clients.
if ($redirect_to_https) { return 301 https://$host$request_uri; }

# $hsts_header is empty unless the edge reported https, and nginx emits nothing for an empty
# add_header value. Careful: a server-level add_header is silently dropped in any location
# that declares its own add_header — repeat this include there if one is ever added.
add_header Strict-Transport-Security $hsts_header always;
