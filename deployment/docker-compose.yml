services:
  fsm-nginx:
    image: nginx:stable-alpine
    container_name: fsm-nginx
    # Custom entrypoint reloads nginx when fail2ban updates the deny-list (no Docker socket).
    entrypoint: ["/bin/sh", "/etc/nginx/reload-on-ban.sh"]
    expose:
      - "80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      # Shared snippets `include`d from conf.d (https_only.conf). Without this mount the
      # includes resolve to nothing and nginx refuses to start.
      - ./config/nginx/snippets:/etc/nginx/snippets:ro
      - ./config/nginx/reload-on-ban.sh:/etc/nginx/reload-on-ban.sh:ro
      # fail2ban deny-list (real client IPs), included by nginx.conf.
      - ./data/blocked:/etc/nginx/blocked:ro
      # Persist data
      - ./data/nginx/html:/usr/share/nginx/html:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - wsl-net
    restart: unless-stopped
    depends_on:
      - fsm-api
      - fsm-web
  fsm-fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fsm-fail2ban
    # Bans via the nginx deny-list (a shared file), not iptables — so no host
    # networking and no NET_ADMIN/NET_RAW are needed (least privilege).
    volumes:
      - ./data/fail2ban:/data
      - ./data/nginx/logs:/var/log/nginx:ro
      # Shared deny-list this container writes and nginx reads.
      - ./data/blocked:/blocked:rw
    networks:
      - wsl-net
    restart: unless-stopped
    depends_on:
      - fsm-nginx
  fsm-mariadb:
    # Pinned to match the MariaDbServerVersion(11, 7, 2) in Program.cs / the design-time factory
    # (avoids the floating `11` tag resolving to a version Pomelo generates mismatched SQL for).
    image: mariadb:11.7
    container_name: fsm-mariadb
    expose:
      - "3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data/mariadb:/var/lib/mysql
      # Runs once on an empty datadir to create the `fairsharemon` database (utf8mb4).
      - ./config/mariadb/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - wsl-net
    restart: unless-stopped
  fsm-redis:
    image: redis:7.4-alpine
    container_name: fsm-redis
    expose:
      - "6379"
    # Persistence/eviction live in redis.conf; the password is passed here to keep the secret
    # out of the committed conf file.
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - wsl-net
    restart: unless-stopped
  fsm-api:
    # Pinned, registry-qualified image. `docker compose build` tags this, `push` uploads it,
    # and the deploy host `pull`s this exact version. Bump API_VERSION in .env per update pack.
    image: ${REGISTRY:-docker-registry.minhkakart.com}/fairsharemon-api:${API_VERSION:-1.0.0}
    container_name: fairsharemon-api-1
    build:
      context: ../FairShareMonApi
      dockerfile: FairShareMonApi/Dockerfile
      tags:
        - ${API_VERSION:-1.0.0}
    expose:
      - "8080"
    environment:
      # ASPNETCORE_ENVIRONMENT selects appsettings.Production.local.json (mounted below) for the app
      # config. The DB/Redis connection strings are injected here from .env — the SINGLE source of
      # those passwords (also consumed by the mariadb/redis containers) — and override the file (env
      # wins), so the password is never duplicated in the mounted file.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=fsm-mariadb;Port=3306;Database=fairsharemon;User=root;Password=${MARIADB_ROOT_PASSWORD}"
      Redis__Configuration: "fsm-redis:6379,password=${REDIS_PASSWORD}"
    volumes:
      # App config (CORS, Admin, migrations, Auth, Tiers, ...) — gitignored, mounted read-only, never
      # baked into the image. Do NOT put the DB/Redis password here; it comes from .env above. Create
      # the file on the host BEFORE `docker compose up` (a missing bind-mount source makes Docker
      # create a directory in its place and the API boots without config).
      - ./config/api/appsettings.Production.local.json:/app/appsettings.Production.local.json:ro
      # No persistent data resource yet — re-enable (with the top-level volume) when the app
      # writes files it needs to keep (e.g. uploads / file logs).
      # - api-data:/app/data
    networks:
      - wsl-net
    restart: unless-stopped
    depends_on:
      fsm-mariadb:
        condition: service_healthy
      fsm-redis:
        condition: service_healthy
  fsm-web:
    # Pinned, registry-qualified image. Bump WEB_VERSION in .env per update pack.
    image: ${REGISTRY:-docker-registry.minhkakart.com}/fairsharemon-web:${WEB_VERSION:-1.0.0}
    container_name: fairsharemon-web-1
    build:
      context: ../FairShareMonWeb
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      tags:
        - ${WEB_VERSION:-1.0.0}
    expose:
      - "5173"
    networks:
      - wsl-net
    restart: unless-stopped
networks:
  wsl-net:
    external: true
# No named volumes yet — reserved for a future api data resource (see the api service).
# volumes:
#   api-data:
